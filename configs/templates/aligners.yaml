experiment_output_dir: IS26-aligns/   

dataset:
    name: 
    metadata: 
    manual_aligns: 
    base_audio_path: 
    apply_enhance: true

aligners:
  - name: full
  
  - name: manual
    params:
      filename: manual
  
  - name: speechbrain
    params:
      postprocess:
        name: silero
        params:
            threshold: 0.2

  - name: whisper
    params:
      model: large
      compute_type: float32
      language: es
      beam_size: 5
      no_speech_prob_threshold: 0.8
      compress_ratio_threshold: 2.4
      
  - name: whisper
    params:
      model: turbo
      compute_type: float32
      language: es
      beam_size: 5
      no_speech_prob_threshold: 0.8
      compress_ratio_threshold: 2.4
      
  - name: whisper
    params:
      model: medium
      compute_type: float32
      language: es
      beam_size: 5
      no_speech_prob_threshold: 0.8
      compress_ratio_threshold: 2.4
      
  - name: whisper
    params:
      model: turbo
      compute_type: float32
      language: es
      beam_size: 5
      no_speech_prob_threshold: 0.8
      compress_ratio_threshold: 2.4
      postprocess:
        name: silero
        params:
            threshold: 0.2
            sample_rate: 16000

  - name: speechbrain
          
  - name: silero
    params:
      threshold: 0.5
  
  - name: silero
    params:
      threshold: 0.2

  - name: silero
    params:
      threshold: 0.2
      postprocess:
        name: torchvad
        params:
          torchVAD_params:
            trigger_level: 5.5
            trigger_time: 0.1
            search_time: 0.5
            allowed_gap: 0.1
            measure_freq: 10.0

  - name: pyannote
    params:
      huggingface_token: ''
  